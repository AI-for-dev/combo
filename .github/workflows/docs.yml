# The documentation site: built on every change, published from `main`.
#
# `-W` turns a Sphinx warning into a failed build, here as in `make -C docs html`
# - a warning is a defect in the documentation, and the same standard applies to
# it as to the code. `--keep-going` so one broken page names all of them rather
# than the first.
#
# Publishing needs the repository's Pages source set to **GitHub Actions**
# (Settings → Pages). Without it the deploy job fails; nothing else does.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-published site
# is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # The reference pages are generated from the TSDoc, and the site publishes
      # whatever is committed. Regenerating and diffing here means a stale
      # reference cannot be deployed as if it were current.
      - name: The reference matches the source
        run: |
          npm run docs
          git diff --exit-code docs/reference/api

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt

      - name: Build the site
        run: python -m sphinx -b html docs docs/_build/html -W --keep-going

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Every pull request builds the site; only `main` publishes it.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
