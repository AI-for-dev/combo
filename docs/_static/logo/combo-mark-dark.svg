<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="combo">
  <title>combo</title>
  <!-- The mark on a dark ground. Slate disappears on #14181B, so the three branches take
       the inverse ink, and the verdigris lifts a step - the darker tone goes muddy there,
       exactly as it does in the palette. Same geometry as -light.svg, colours apart. -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <g stroke="#C9D3DB">
      <path d="M8 14 H16 C26 14 24 32 34 32" />
      <path d="M8 32 H34" />
      <path d="M8 50 H16 C26 50 24 32 34 32" />
    </g>
    <path stroke="#4FB8AC" d="M34 32 H56" />
  </g>
</svg>
