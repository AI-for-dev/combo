<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64" role="img" aria-label="combo">
  <title>combo</title>
  <!-- Horizontal lockup for a light ground: the mark, then the word drawn in the same
       strokes it is. The wordmark is geometry, not type - circles of radius 10 on a 20-unit
       x-height, one stroke width throughout - so it carries no font dependency, cannot fall
       back silently on a reader who lacks a typeface, and needs no generator to rebuild.
       See README.md in this directory before editing a coordinate. -->
