<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="combo">
  <title>combo</title>
  <!-- The mark: three bars, one bracket. The bars are equal and in the ink, because a
       fan-out has no favourite branch; the bracket is the accent, because holding the
       three as one is the claim of the library. Explicit colours for a light ground,
       because currentColor does not cross an <img> boundary - the theme's text colour
       never reaches an SVG referenced as an image. See -dark.svg. -->
  <g fill="#232B33">
    <rect x="28" y="19.5" width="24" height="5" />
    <rect x="28" y="29.5" width="24" height="5" />
    <rect x="28" y="39.5" width="24" height="5" />
  </g>
  <path fill="#227D74" d="M12 16 H24 V21 H17 V43 H24 V48 H12 Z" />
</svg>
